<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Everyday Calculator</title>
<style>
  :root {
    color-scheme: light;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #24332e;
    background: #f3f5f0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; }
  button { font: inherit; }
  .page {
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    max-width: 1440px;
    margin: auto;
    padding: 32px 7%;
  }
  .topbar, .footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 750; letter-spacing: -.02em; }
  .brand-mark { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 9px; background: #385f4d; color: white; font-size: 18px; line-height: 1; }
  .top-note, .footer { font-size: 12px; color: #52675b; }
  main { display: grid; place-items: center; padding: 52px 0 64px; }
  .workspace { width: min(100%, 410px); }
  .heading { text-align: center; margin-bottom: 29px; }
  .eyebrow { color: #52675b; font-size: 10px; font-weight: 800; letter-spacing: .19em; text-transform: uppercase; }
  h1 { margin: 10px 0 8px; font-size: clamp(27px, 5vw, 34px); letter-spacing: -.055em; line-height: 1.12; font-weight: 700; }
  .subtitle { margin: 0; color: #52675b; font-size: 13px; line-height: 1.6; }
  .calculator { background: #fff; border: 1px solid #e8ede7; border-radius: 24px; padding: 22px; box-shadow: 0 20px 55px rgba(45, 67, 52, .08), 0 3px 10px rgba(45, 67, 52, .035); }
  .calc-header { display: flex; justify-content: space-between; align-items: center; padding: 1px 2px 16px; }
  .calc-title { font-size: 11px; font-weight: 750; letter-spacing: .09em; text-transform: uppercase; color: #63766a; }
  .status { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #52675b; }
  .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #91b69b; }
  .screen { background: #f3f7f2; border: 1px solid #ebf0e9; border-radius: 15px; min-height: 128px; padding: 19px 19px 16px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end; overflow: hidden; }
  .expression { min-height: 20px; max-width: 100%; color: #879b8d; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .display { max-width: 100%; color: #273e31; font-size: clamp(30px, 7vw, 42px); font-weight: 600; letter-spacing: -.055em; line-height: 1.2; overflow-wrap: anywhere; text-align: right; }
  .display.error { font-size: 23px; letter-spacing: -.03em; }
  .keypad { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 17px; }
  .key { min-width: 0; height: 57px; border: 1px solid #eef1ed; border-radius: 12px; background: #f8faf7; color: #34483b; font-size: 19px; font-weight: 600; cursor: pointer; transition: background .15s, transform .15s, border-color .15s; }
  .key:hover { background: #edf3ec; border-color: #dce7dc; }
  .key:active { transform: scale(.96); }
  .key:focus-visible { outline: 3px solid #81a98e; outline-offset: 2px; }
  .key.clear { color: #52675b; font-size: 13px; font-weight: 750; letter-spacing: .02em; grid-column: span 2; }
  .key.operator { background: #eaf1e9; color: #4b7159; font-size: 22px; }
  .key.operator[aria-pressed="true"] { background: #d7e7d8; border: 2px solid #71967b; }
  .key.equals { background: #426b50; color: #fff; border-color: #426b50; grid-column: span 2; font-size: 22px; }
  .key.equals:hover { background: #345a41; }
  .key.zero { grid-column: span 2; }
  .hint { text-align: center; margin: 22px 0 0; color: #52675b; font-size: 11px; line-height: 1.7; }
  .hint kbd { font: inherit; font-weight: 650; color: #52675b; background: #e9eee8; border: 1px solid #e2e9e1; border-radius: 4px; padding: 2px 5px; }
  .footer { border-top: 1px solid #e6ebe5; padding-top: 19px; }
  .footer strong { color: #52675b; font-weight: 600; }
  @media (max-width: 480px) {
    .page { padding: 22px 18px; }
    .top-note { display: none; }
    main { padding: 42px 0; }
    .calculator { padding: 16px; border-radius: 20px; }
    .keypad { gap: 8px; }
    .key { height: 56px; }
    .footer { font-size: 10px; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">✳</span> everyday tools</div>
    <span class="top-note">A little simplicity for your day.</span>
  </header>
  <main>
    <section class="workspace" aria-labelledby="page-title">
      <div class="heading">
        <div class="eyebrow">A simple tool for everyday</div>
        <h1 id="page-title">Calculator</h1>
        <p class="subtitle">A little help with the numbers.</p>
      </div>
      <div class="calculator">
        <div class="calc-header">
          <span class="calc-title">Standard</span>
          <span class="status">Ready to calculate</span>
        </div>
        <div class="screen" aria-label="Calculator display">
          <div id="expression" class="expression" aria-hidden="true"></div>
          <div id="display" class="display" aria-hidden="true">0</div>
        </div>
        <div id="announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
        <div class="keypad" aria-label="Calculator keypad">
          <button class="key clear" data-action="clear" aria-label="Clear">AC</button>
          <button class="key operator" data-op="/" aria-label="Divide" aria-pressed="false">÷</button>
          <button class="key operator" data-op="*" aria-label="Multiply" aria-pressed="false">×</button>
          <button class="key" data-digit="7">7</button>
          <button class="key" data-digit="8">8</button>
          <button class="key" data-digit="9">9</button>
          <button class="key operator" data-op="-" aria-label="Subtract" aria-pressed="false">−</button>
          <button class="key" data-digit="4">4</button>
          <button class="key" data-digit="5">5</button>
          <button class="key" data-digit="6">6</button>
          <button class="key operator" data-op="+" aria-label="Add" aria-pressed="false">+</button>
          <button class="key" data-digit="1">1</button>
          <button class="key" data-digit="2">2</button>
          <button class="key" data-digit="3">3</button>
          <button class="key" data-action="decimal" aria-label="Decimal point">.</button>
          <button class="key zero" data-digit="0">0</button>
          <button class="key equals" data-action="equals" aria-label="Equals">=</button>
        </div>
      </div>
      <p class="hint">Use your keyboard, too &nbsp;·&nbsp; <kbd>esc</kbd> to clear</p>
    </section>
  </main>
  <footer class="footer"><span><strong>everyday tools</strong> &nbsp;·&nbsp; Made for the little things</span><span>Simple by design.</span></footer>
</div>
<style>
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
</style>
<script>
(function () {
  "use strict";
  const symbols = {"+": "+", "-": "−", "*": "×", "/": "÷"};
  function compute(a, operator, b) {
    a = Number(a); b = Number(b);
    if (!Number.isFinite(a) || !Number.isFinite(b)) throw new Error("Invalid number");
    let result;
    switch (operator) {
      case "+": result = a + b; break;
      case "-": result = a - b; break;
      case "*": case "×": result = a * b; break;
      case "/": case "÷":
        if (b === 0) throw new Error("Cannot divide by zero");
        result = a / b; break;
      default: throw new Error("Unknown operator");
    }
    if (!Number.isFinite(result)) throw new Error("Result is too large");
    result = Number(result.toPrecision(12));
    return Object.is(result, -0) ? 0 : result;
  }
  window.factoryCompute = compute;

  const display = document.getElementById("display");
  const expression = document.getElementById("expression");
  const announcement = document.getElementById("announcement");
  const operators = document.querySelectorAll("[data-op]");
  let state;
  function reset() { state = {value: "0", left: null, op: null, waiting: false, result: false, error: false}; }
  function render() {
    display.textContent = state.value;
    display.classList.toggle("error", state.error);
    const pending = state.op ? String(state.left) + " " + symbols[state.op] : "";
    expression.textContent = pending;
    operators.forEach(button => button.setAttribute("aria-pressed", String(button.dataset.op === state.op)));
    announcement.textContent = state.error ? state.value : (pending ? pending + ", " : "") + state.value;
  }
  function digit(d) {
    if (state.error) reset();
    if (state.waiting || state.result) {
      state.value = d; state.waiting = false; state.result = false;
      return;
    }
    const count = state.value.replace(".", "").replace(/^0+/, "").length;
    if (count >= 12) return;
    state.value = state.value === "0" ? d : state.value + d;
  }
  function decimal() {
    if (state.error) return;
    if (state.waiting || state.result) {
      state.value = "0."; state.waiting = false; state.result = false;
    } else if (!state.value.includes(".") && !/[eE]/.test(state.value)) state.value += ".";
  }
  function calculate() {
    try {
      state.value = String(compute(state.left, state.op, Number(state.value)));
      state.left = null; state.op = null; state.waiting = false; state.result = true;
      return true;
    } catch (err) {
      state.value = err.message; state.left = null; state.op = null;
      state.waiting = false; state.result = false; state.error = true;
      return false;
    }
  }
  function operation(op) {
    if (state.error) return;
    if (state.op && !state.waiting && !calculate()) return;
    state.left = Number(state.value); state.op = op; state.waiting = true; state.result = false;
  }
  function equals() {
    if (state.error || !state.op || state.waiting) return;
    calculate();
  }
  function act(type, value) {
    if (type === "digit") digit(value);
    else if (type === "decimal") decimal();
    else if (type === "op") operation(value);
    else if (type === "equals") equals();
    else if (type === "clear") reset();
    render();
  }
  document.querySelector(".keypad").addEventListener("click", function (event) {
    const button = event.target.closest("button");
    if (!button) return;
    if (button.dataset.digit !== undefined) act("digit", button.dataset.digit);
    else if (button.dataset.op) act("op", button.dataset.op);
    else act(button.dataset.action);
  });
  document.addEventListener("keydown", function (event) {
    if (event.ctrlKey || event.metaKey || event.altKey || event.isComposing) return;
    if ((event.key === "Enter" || event.key === " ") && document.activeElement instanceof HTMLButtonElement) return;
    let type, value;
    if (/^[0-9]$/.test(event.key)) { type = "digit"; value = event.key; }
    else if (event.key === ".") type = "decimal";
    else if (Object.prototype.hasOwnProperty.call(symbols, event.key)) { type = "op"; value = event.key; }
    else if (event.key === "Enter" || event.key === "=") type = "equals";
    else if (event.key === "Escape") type = "clear";
    else return;
    event.preventDefault(); act(type, value);
  });
  reset(); render();
}());
</script>
</body>
</html>
